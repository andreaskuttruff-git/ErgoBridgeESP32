; ErgoBridge - Daum ergo_bike cockpit (RS232) as a Bluetooth smart trainer (FTMS).
;   pio run -e esp32          firmware for the real cockpit (UART2: GPIO16 RX, GPIO17 TX via MAX3232)
;   pio run -e esp32-sim      firmware with a built-in simulated cockpit, needs nothing but the board
;   pio test -e native        unit tests on the PC (needs a host gcc/g++)

[platformio]
default_envs = esp32-sim

[env]
test_framework = unity

[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -std=gnu++17 -Wall
build_unflags = -std=gnu++11

[env:esp32]
extends = esp32_base

[env:esp32-sim]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -DERGOBRIDGE_SIMULATED_COCKPIT

[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
test_build_src = no
