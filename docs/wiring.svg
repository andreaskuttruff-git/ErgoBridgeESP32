<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>ErgoBridge wiring</title>
  <desc>A 5 V USB power supply feeds the ESP32. ESP32 3V3, GND, GPIO17 (TX2) and GPIO16 (RX2) go to a MAX3232. T1OUT goes to pin 3 and R1IN to pin 2 of a female DB9 (the end of a cut serial cable) plugged straight onto the cockpit's male connector. T2IN is tied to ground, so T2OUT is always positive; it pulls pin 2 up through a 4.7 kOhm resistor, replacing the resistor inside the original Daum cable.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="540" fill="#FFFFFF"/>

  <rect x="40" y="30" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="130" y="53" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">USB power supply 5 V</text>
  <text x="130" y="72" text-anchor="middle" font-size="12" fill="#5F5E5A">Micro-USB on the ESP32</text>
  <line x1="130" y1="86" x2="130" y2="118" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="120" width="180" height="240" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="130" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">ESP32-WROOM-32</text>
  <g font-size="12" fill="#0F6E56" text-anchor="end">
    <text x="210" y="168">3V3</text>
    <text x="210" y="208">GND</text>
    <text x="210" y="248">GPIO17 (TX2)</text>
    <text x="210" y="288">GPIO16 (RX2)</text>
  </g>

  <rect x="300" y="120" width="170" height="240" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="385" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">MAX3232</text>
  <g font-size="12" fill="#534AB7">
    <text x="310" y="168">VCC</text>
    <text x="310" y="208">GND</text>
    <text x="310" y="248">T1IN</text>
    <text x="310" y="288">R1OUT</text>
    <text x="310" y="328">T2IN to GND</text>
  </g>
  <g font-size="12" fill="#534AB7" text-anchor="end">
    <text x="460" y="248">T1OUT</text>
    <text x="460" y="288">R1IN</text>
    <text x="460" y="328">T2OUT</text>
  </g>

  <rect x="560" y="120" width="80" height="240" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="600" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">DB9</text>
  <text x="600" y="162" text-anchor="middle" font-size="12" fill="#5F5E5A">female</text>
  <g font-size="12" fill="#5F5E5A">
    <text x="570" y="248">Pin 3</text>
    <text x="570" y="288">Pin 2</text>
  </g>

  <line x1="220" y1="164" x2="300" y2="164" stroke="#E24B4A" stroke-width="2"/>
  <line x1="220" y1="204" x2="300" y2="204" stroke="#888780" stroke-width="2"/>
  <line x1="220" y1="244" x2="298" y2="244" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="284" x2="222" y2="284" stroke="#7F77DD" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="244" x2="558" y2="244" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="284" x2="472" y2="284" stroke="#7F77DD" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M470 324 L520 324 L520 316" fill="none" stroke="#BA7517" stroke-width="2"/>
  <rect x="512" y="294" width="16" height="22" rx="2" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
  <line x1="520" y1="294" x2="520" y2="284" stroke="#BA7517" stroke-width="2"/>
  <circle cx="520" cy="284" r="3.5" fill="#BA7517"/>
  <text x="478" y="346" font-size="12" fill="#854F0B">4.7 kΩ</text>

  <line x1="600" y1="360" x2="600" y2="418" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="460" y="420" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="550" y="443" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Daum cockpit</text>
  <text x="550" y="462" text-anchor="middle" font-size="12" fill="#5F5E5A">male DB9, underside</text>

  <g font-size="12" fill="#5F5E5A">
    <text x="40" y="392">Red 3.3 V · grey ground · green transmit</text>
    <text x="40" y="410">purple receive · amber pull-up (always on)</text>
    <text x="40" y="436">MAX3232 on 3.3 V, never 5 V.</text>
    <text x="40" y="460">Only pins 2 and 3 go to the cockpit. The 4.7 kΩ</text>
    <text x="40" y="478">replaces the resistor inside the Daum PC cable:</text>
    <text x="40" y="496">T2OUT pulls pin 2 up, the cockpit pulls it down.</text>
  </g>
</svg>
