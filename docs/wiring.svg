<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>ErgoBridge wiring</title>
  <desc>A 5 V USB power supply feeds the ESP32. ESP32 3V3, GND, GPIO17 (TX2) and GPIO16 (RX2) go to a MAX3232 module. Its RS232 side goes to a DB9 connector wired like a PC's COM port (pin 3 transmit, pin 2 receive, pin 5 ground) and through the Daum PC cable to the cockpit's 9-pin socket.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#FFFFFF"/>

  <rect x="40" y="30" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="130" y="53" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">USB power supply 5 V</text>
  <text x="130" y="72" text-anchor="middle" font-size="12" fill="#5F5E5A">Micro-USB on the ESP32</text>
  <line x1="130" y1="86" x2="130" y2="118" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="120" width="180" height="200" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="130" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">ESP32-WROOM-32</text>
  <g font-size="12" fill="#0F6E56" text-anchor="end">
    <text x="210" y="168">3V3</text>
    <text x="210" y="208">GND</text>
    <text x="210" y="248">GPIO17 (TX2)</text>
    <text x="210" y="288">GPIO16 (RX2)</text>
  </g>

  <rect x="300" y="120" width="170" height="200" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="385" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">MAX3232 module</text>
  <g font-size="12" fill="#534AB7">
    <text x="310" y="168">VCC</text>
    <text x="310" y="208">GND</text>
    <text x="310" y="248">TXD</text>
    <text x="310" y="288">RXD</text>
  </g>
  <g font-size="12" fill="#534AB7" text-anchor="end">
    <text x="460" y="208">GND</text>
    <text x="460" y="248">T1OUT</text>
    <text x="460" y="288">R1IN</text>
  </g>

  <rect x="540" y="120" width="100" height="200" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="590" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">DB9 (as PC)</text>
  <g font-size="12" fill="#5F5E5A">
    <text x="550" y="208">Pin 5</text>
    <text x="550" y="248">Pin 3</text>
    <text x="550" y="288">Pin 2</text>
  </g>

  <line x1="220" y1="164" x2="300" y2="164" stroke="#E24B4A" stroke-width="2"/>
  <line x1="220" y1="204" x2="300" y2="204" stroke="#888780" stroke-width="2"/>
  <line x1="220" y1="244" x2="298" y2="244" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="284" x2="222" y2="284" stroke="#7F77DD" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="204" x2="540" y2="204" stroke="#888780" stroke-width="2"/>
  <line x1="470" y1="244" x2="538" y2="244" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="284" x2="472" y2="284" stroke="#7F77DD" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="590" y1="320" x2="590" y2="378" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="470" y="380" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="555" y="403" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Daum PC cable</text>
  <text x="555" y="422" text-anchor="middle" font-size="12" fill="#5F5E5A">cockpit socket, underside</text>

  <g font-size="12" fill="#5F5E5A">
    <text x="40" y="362">Red 3.3 V · grey ground · green transmit · purple receive</text>
    <text x="40" y="382">MAX3232 on 3.3 V, never 5 V:</text>
    <text x="40" y="400">the ESP32 pins are not 5 V tolerant.</text>
    <text x="40" y="424">Measure the cable first (see README).</text>
  </g>
</svg>
